[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "uptimemesh"
dynamic = ["version"]
description = "UptimeMesh control-plane UI and API"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
  "fastapi==0.129.0",
  "uvicorn==0.41.0",
  "sqlalchemy==2.0.46",
  "greenlet==3.3.1",
  "aiosqlite==0.22.1",
  "pydantic-settings==2.13.0",
  "alembic==1.18.4",
  "jinja2==3.1.6",
  "python-multipart==0.0.22",
  "PyYAML==6.0.2",
  "cryptography==46.0.5",
  "prometheus-client==0.24.1",
  "argon2-cffi==25.1.0",
]

[project.scripts]
uptimemesh = "app.cli:main"

[project.optional-dependencies]
dev = [
  "ruff==0.15.1",
  "pytest==9.0.2",
  "pyright==1.1.408",
]

[tool.ruff]
line-length = 100

[tool.pyright]
pythonVersion = "3.11"
reportMissingTypeStubs = false
reportMissingModuleSource = false
exclude = ["build", "dist", ".venv"]
venvPath = "."
venv = ".venv"

[tool.setuptools.packages.find]
include = ["app*", "migrations*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]
migrations = ["script.py.mako"]

[tool.setuptools.data-files]
"." = ["alembic.ini", "go.mod", "version.json", "install.sh", "requirements.lock"]
"agent/cmd/uptimemesh-agent" = [
  "agent/cmd/uptimemesh-agent/main.go",
]
"ops" = [
  "ops/agent-update.sh",
  "ops/bootstrap.sh",
  "ops/install.sh",
  "ops/node-update.sh",
  "ops/update.sh",
  "ops/watchdog.py",
]

[tool.setuptools.dynamic]
version = {attr = "app.versioning.__version__"}
